schema: spec-driven

context: |
  Tech stack: TypeScript, React, Vite, Vitest, Docker (Node in containers; prefer ./dev.sh).
  Domain: tile board game prototyping.

  Operating model (see AGENT.md):
  - templates/<id>/ = reusable template docs/metadata; runtime in packages/engine + packages/web.
  - prototypes/<id>/ = named game versions (config + optional extensions). Never fork packages for a normal new game.
  - Register prototypes in packages/web/src/prototypes/registry.ts.
  - Launch: ./dev.sh up <prototype> [port] for simultaneous instances.

  OpenSpec is mandatory for every behavior change (including minor UI/rule tweaks).
  Minor work: use openspec-fasttrack (slim change → implement → archive into specs → commit+push).
  Do not implement feature code before creating an OpenSpec change.

  Cursor skills: openspec-fasttrack, prototype-from-template, archive-and-push, openspec-*.

rules:
  proposal:
    - Prefer prototypes over template forks when adding a game version
    - Even minor follow-up requests need an OpenSpec change (use fast-track when appropriate)
  tasks:
    - Include registry + Dockerfile workspace package steps when adding prototypes
    - End with archive + archive-and-push (commit and push) unless the user forbids it

operations:
  apply:
    guidance:
      - Follow AGENT.md template/prototype rules when implementing game versions
      - Do not apply code for a behavior change that has no OpenSpec change artifacts
  archive:
    guidance:
      - After a successful archive, follow .cursor/skills/archive-and-push: commit relevant changes and push to origin unless the user forbids push
      - Summarize archive path, commit, and push result
